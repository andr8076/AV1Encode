name: Test AV1Encode

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg ripgrep
      - name: Run regression and encode tests
        run: |
          bash tests/test.sh
          bash tests/semantic-v2.sh
